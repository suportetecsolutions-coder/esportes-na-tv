name: Atualizar e publicar Esportes na TV
on:
  schedule:
    - cron: "17 */3 * * *"   # só reserva (a cada 3 h): quem dispara a cada 30 min é o cron-job.org
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]   # mudar só documentação não roda o robô
permissions: {}   # nada por padrão; cada job pede só o que precisa
concurrency: { group: pages, cancel-in-progress: false }   # não cancela uma execução longa: o próximo disparo espera na fila
jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: read }
    steps:
      # actions fixadas pelo código (SHA) da versão, para ninguém trocar o conteúdo por baixo; o Dependabot avisa quando houver versão nova
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: node scripts/atualizar.mjs
        env: { FOOTBALL_DATA_KEY: "${{ secrets.FOOTBALL_DATA_KEY }}", API_FOOTBALL_KEY: "${{ secrets.API_FOOTBALL_KEY }}" }
      - name: Monta a pasta publicada (só o que o site usa)
        run: |
          mkdir _site
          cp -r index.html sobre.html app.js style.css apoio.json data vendor anuncios _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }
  publicar:
    needs: montar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
