name: Atualizar e publicar Esportes na TV
on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 min (placar ao vivo). Troque por "0 6 * * *" para 1x ao dia.
  workflow_dispatch:
  push:
    branches: [main]
permissions: { contents: read, actions: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/atualizar.mjs
        env: { FOOTBALL_DATA_KEY: "${{ secrets.FOOTBALL_DATA_KEY }}", API_FOOTBALL_KEY: "${{ secrets.API_FOOTBALL_KEY }}" }
      - name: Monta a pasta publicada (sem scripts)
        run: |
          mkdir _site
          cp -r index.html app.js style.css canais.json esportes.json apoio.json data vendor anuncios _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
